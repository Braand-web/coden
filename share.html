<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Projet partagé | Coden</title>
    <script>
      (() => {
        const root = document.documentElement;
        const key = 'coden-theme';
        const system = window.matchMedia?.('(prefers-color-scheme: dark)');
        const stored = () => { try { const v = localStorage.getItem(key); return v === 'dark' || v === 'light' ? v : null; } catch { return null; } };
        const apply = (theme = stored() || (system?.matches ? 'dark' : 'light')) => { root.dataset.theme = theme; root.style.colorScheme = theme; };
        apply();
        system?.addEventListener('change', () => { if (!stored()) apply(); });
      })();
    </script>
    <style>
      :root { font-family: Geist, system-ui, sans-serif; --page: var(--background); --ink: var(--foreground); --muted: var(--text-muted); --accent-ink: var(--background); --focus: color-mix(in srgb, var(--accent) 55%, var(--background)); background: var(--page); color: var(--ink); }
      *, *::before, *::after { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: var(--page); }
      .shell { width: min(100%, 880px); }
      .brand { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 20px 4px; color: var(--ink); font-size: 16px; font-weight: 600; text-decoration: none; }
      .brand img { width: 28px; height: 28px; }
      .card { padding: clamp(18px, 4vw, 32px); border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: 0 12px 36px color-mix(in srgb, var(--ink) 7%, transparent); }
      .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); font-weight: 600; letter-spacing: -.035em; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
      .description { max-width: 62ch; margin: 10px 0 0; color: var(--muted); font-size: 16px; line-height: 24px; overflow-wrap: anywhere; }
      .frame { margin-top: 22px; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: color-mix(in srgb, var(--ink) 4%, var(--surface)); }
      .frame { position: relative; }
      .frame iframe { position: absolute; top: 0; left: 0; display: block; width: 1280px; border: 0; transform-origin: 0 0; pointer-events: none; background: var(--background); }
      .frame[hidden] { display: none; }
      .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 24px; }
      button, a.button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 10px 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; transition: transform 160ms cubic-bezier(.32,.72,0,1), box-shadow 160ms cubic-bezier(.32,.72,0,1); }
      button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
      button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px color-mix(in srgb, var(--ink) 12%, transparent); }
      button:disabled { cursor: progress; opacity: .65; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      .note { margin: 0; color: var(--muted); font-size: 13px; line-height: 20px; }
      .error { color: var(--danger); }
      .skeleton { height: 18px; margin-top: 12px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
      @media (max-width: 480px) { body { padding: 16px; } .actions { display: grid; } button, a.button { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <a class="brand" href="/" aria-label="Coden, accueil"><img src="/favicon.svg" alt=""><span>Coden</span></a>
      <main class="card" id="main-content" aria-live="polite">
        <p class="eyebrow">Projet partagé</p>
        <h1 id="share-title">Ouverture du lien…</h1>
        <div class="skeleton" style="width:70%"></div>
        <div class="skeleton" style="width:45%"></div>
        <div class="frame" id="share-frame" hidden></div>
        <div class="actions" id="share-actions" hidden>
          <button class="primary" id="share-copy" type="button">Créer ma copie</button>
          <p class="note" id="share-note">Vous recevez une copie des fichiers dans votre compte Coden. L’original n’est pas modifié.</p>
        </div>
        <p class="note error" id="share-error" role="alert" hidden></p>
      </main>
    </div>
    <script type="module" src="/src/share-page.ts"></script>
  </body>
</html>
