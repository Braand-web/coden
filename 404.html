<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f8f9fb">
    <title>Page introuvable | Coden</title>
    <script>
      (() => {
        const root = document.documentElement;
        const key = 'coden-theme';
        const system = window.matchMedia?.('(prefers-color-scheme: dark)');
        const storedTheme = () => {
          try {
            const value = localStorage.getItem(key);
            return value === 'dark' || value === 'light' ? value : null;
          } catch { return null; }
        };
        const applyTheme = (theme = storedTheme() || (system?.matches ? 'dark' : 'light')) => {
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        };
        applyTheme();
        system?.addEventListener('change', () => { if (!storedTheme()) applyTheme(); });
        window.addEventListener('storage', (event) => { if (!event.key || event.key === key) applyTheme(); });
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: Geist, system-ui, sans-serif;
        --page: #f8f9fb;
        --surface: #ffffff;
        --border: #e2e4e8;
        --ink: #1a1c1f;
        --muted: #656a73;
        --accent: #3a83f7;
        --focus: #91baff;
        background: var(--page);
        color: var(--ink);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #111111;
        --surface: #1c1c1c;
        --border: #313131;
        --ink: #fcfcfc;
        --muted: #9f9f9f;
        --focus: #8dbbff;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--page);
      }
      .page-shell { width: min(100%, 560px); }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 24px 4px;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
      .brand img { width: 28px; height: 28px; }
      .card {
        padding: clamp(24px, 6vw, 40px);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 12px 36px color-mix(in srgb, var(--ink) 7%, transparent);
      }
      .code {
        margin: 0 0 24px;
        color: var(--accent);
        font-size: clamp(72px, 18vw, 96px);
        font-weight: 600;
        letter-spacing: -.075em;
        line-height: 1;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(24px, 5vw, 30px);
        font-weight: 600;
        letter-spacing: -.035em;
        line-height: 1.2;
        text-wrap: balance;
      }
      .description {
        max-width: 420px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 24px;
        text-wrap: pretty;
      }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      nav a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 160ms cubic-bezier(.32,.72,0,1),
          background-color 160ms cubic-bezier(.32,.72,0,1),
          border-color 160ms cubic-bezier(.32,.72,0,1),
          box-shadow 160ms cubic-bezier(.32,.72,0,1);
      }
      nav a.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
      nav a:hover { transform: translateY(-1px); box-shadow: 0 6px 16px color-mix(in srgb, var(--ink) 12%, transparent); }
      nav a.primary:hover { background: #2c74e7; }
      nav a:active { transform: translateY(1px) scale(.98); }
      a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      @media (max-width: 420px) {
        body { padding: 16px; }
        nav { display: grid; }
        nav a { width: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <a class="brand" href="/" aria-label="Coden, accueil">
        <img src="/favicon.svg" alt="">
        <span>Coden</span>
      </a>
      <main class="card" id="main-content" aria-labelledby="page-title">
        <p class="code" aria-hidden="true">404</p>
        <p class="eyebrow">Page introuvable</p>
        <h1 id="page-title">Cette page n’existe pas.</h1>
        <p class="description">L’adresse est peut-être incorrecte ou la page a été déplacée.</p>
        <nav aria-label="Liens utiles">
          <a class="primary" href="/">Retour à l’accueil</a>
          <a href="/pricing.html">Voir les tarifs</a>
        </nav>
      </main>
    </div>
  </body>
</html>
