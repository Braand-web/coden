<!-- CODEN_SEO_START -->
<!-- CODEN_SEO_END -->
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('coden-theme');
        const theme = stored === 'dark' || stored === 'light'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=optional" crossorigin="anonymous" data-coden-fonts/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=optional" crossorigin="anonymous" media="print" onload="this.media='all';this.onload=null"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=optional" crossorigin="anonymous"/></noscript>
  <script type="module" src="/src/auth-guard.ts"></script>
</head>

</body>
