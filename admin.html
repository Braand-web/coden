  <link rel="stylesheet" href="/src/index.css">
  <style>
    body {background: var(--surface);
      min-height: 100vh;
    }

    .admin-shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }

    .admin-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--foreground);
      font-weight: 850;
      letter-spacing: -0.04em;
      text-decoration: none;
      font-size: 22px;
    }

    .admin-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--background);
      font: 900 13px/1 "JetBrains Mono", monospace;
    }

    .admin-nav {
      display: grid;
      gap: 6px;
    }

    .admin-nav button,
    .admin-return {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 760;
      border: 1px solid transparent;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .admin-nav button:hover,
    .admin-nav button.active,
    .admin-return:hover {
      background: var(--surface-soft);
      color: var(--foreground);
      border-color: var(--border);
    }

    .admin-main {
      padding: 26px clamp(18px, 3vw, 36px) 56px;
      min-width: 0;
    }

    .admin-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .admin-commandbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: -8px 0 22px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 70px -62px color-mix(in srgb, var(--foreground) 42%, transparent);
    }

    .admin-global-search {
      flex: 1 1 360px;
      min-width: min(100%, 260px);
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--input);
      color: var(--foreground);
      padding: 0 15px;
      outline: none;
      font-size: 13px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .admin-global-search:focus,
    .admin-search:focus {
      border-color: var(--field-focus-border);
      box-shadow: var(--ring);
    }

    .admin-live-status {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      background: var(--surface-soft);
      font: 760 11px/1 "JetBrains Mono", monospace;
      white-space: nowrap;
    }

    .admin-live-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent);
    }

    .admin-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .admin-title {
      font-size: clamp(30px, 4vw, 54px);
      line-height: 0.94;
      letter-spacing: -0.065em;
      max-width: 820px;
    }

    .admin-subtitle {
      color: var(--text-muted);
      max-width: 720px;
      line-height: 1.55;
      margin-top: 12px;
      font-size: 15px;
    }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .admin-button {
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--foreground);
      background: var(--surface);
      font-weight: 780;
      font-size: 12px;
    }

    .admin-button.primary {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--foreground);
    }

    .admin-button.subtle {
      background: transparent;
      color: var(--text-muted);
    }

    .admin-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
    }

    .admin-card {
      grid-column: span 4;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      padding: 16px;
      min-width: 0;
      box-shadow: 0 20px 70px -58px color-mix(in srgb, var(--foreground) 45%, transparent);
    }

    .admin-card.clickable {
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .admin-card.clickable:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .admin-card.wide { grid-column: span 8; }
    .admin-card.full { grid-column: 1 / -1; }

    .metric-label,
    .panel-label {
      color: var(--text-secondary);
      font-size: 11px;
      font-family: var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .metric-value {
      display: block;
      margin-top: 12px;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 850;
    }

    .metric-note {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.45;
    }

    .admin-section {
      display: none;
      animation: adminReveal 220ms ease both;
    }

    .admin-section.active {
      display: block;
    }

    .admin-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .admin-filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 0 0 12px;
    }

    .admin-filter-chip {
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .admin-filter-chip:hover,
    .admin-filter-chip.active {
      color: var(--foreground);
      border-color: var(--accent);
      background: var(--surface-soft);
    }

    .admin-search {
      width: min(360px, 100%);
      height: 40px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--foreground);
      border-radius: 999px;
      padding: 0 14px;
      outline: none;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .admin-table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: color-mix(in srgb, var(--background) 72%, transparent);
    }

    .admin-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--text-secondary);
      font: 800 10px/1 "JetBrains Mono", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .admin-table td {
      padding: 12px 8px;
      color: var(--text-muted);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 66%, transparent);
      vertical-align: top;
    }

    .admin-table tr {
      transition: background 140ms ease;
    }

    .admin-table tbody tr:hover {
      background: color-mix(in srgb, var(--accent) 7%, transparent);
    }

    .admin-table strong {
      color: var(--foreground);
      font-weight: 780;
    }

    .admin-mono {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-all;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface-soft);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
    }

    .status-pill.ok,
    .status-pill.ready,
    .status-pill.completed,
    .status-pill.published { color: var(--success); }

    .status-pill.warning,
    .status-pill.draft,
    .status-pill.running { color: var(--syntax-orange); }

    .status-pill.failed,
    .status-pill.error,
    .status-pill.blocked { color: var(--danger); }

    .health-list,
    .flag-list {
      display: grid;
      gap: 8px;
    }

    .health-row,
    .flag-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .health-row span,
    .flag-row span {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .admin-empty,
    .admin-error {
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--text-muted);
      background: var(--surface);
      line-height: 1.55;
    }

    .admin-error {
      color: var(--danger);
    }

    .admin-skeleton {
      display: grid;
      gap: 10px;
    }

    .admin-skeleton-line {
      height: 42px;
      border-radius: 12px;background: var(--surface);
      background-size: 220% 100%;
      animation: adminShimmer 1.4s ease-in-out infinite;
    }

    .admin-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(520px, 100%);
      height: 100vh;
      z-index: 70;
      padding: 20px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      transform: translateX(102%);
      transition: transform 220ms ease;
      box-shadow: -28px 0 80px color-mix(in srgb, var(--foreground) 24%, transparent);
      overflow: auto;
    }

    .admin-drawer.open {
      transform: translateX(0);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 65;
      background: color-mix(in srgb, var(--surface) 18%, transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-close {
      float: right;
      color: var(--text-secondary);
      font-size: 24px;
    }

    .drawer-title {
      margin: 6px 40px 4px 0;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .drawer-subtitle {
      margin: 0 0 16px;
      color: var(--text-muted);
      line-height: 1.45;
      font-size: 13px;
    }

    .drawer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 16px;
    }

    .drawer-grid {
      display: grid;
      gap: 10px;
    }

    .drawer-field {
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface-soft);
      padding: 11px;
    }

    .drawer-field span {
      display: block;
      color: var(--text-secondary);
      font: 800 10px/1 "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
    }

    .drawer-field strong,
    .drawer-field code {
      color: var(--foreground);
      font-size: 13px;
      word-break: break-word;
    }

    .support-summary {
      white-space: pre-wrap;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    @keyframes adminReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes adminShimmer {
      from { background-position: 120% 0; }
      to { background-position: -120% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .admin-section,
      .admin-card.clickable,
      .admin-drawer,
      .drawer-backdrop,
      .admin-skeleton-line {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 980px) {
      .admin-shell {
        grid-template-columns: 1fr;
      }

      .admin-sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .admin-nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .admin-topbar {
        flex-direction: column;
      }

      .admin-actions {
        justify-content: flex-start;
      }

      .admin-commandbar {
        align-items: stretch;
      }

      .admin-live-status {
        width: 100%;
      }

      .admin-card,
      .admin-card.wide {
        grid-column: 1 / -1;
      }
    }
    /* Claude-inspired admin shell, adapted for Coden operations. */
    body {background: var(--surface);
      color: var(--foreground);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;background: var(--surface);
      opacity: 0.55;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;background: var(--surface);
      filter: blur(14px);
      opacity: 0.28;
    }

    .admin-shell {
      position: relative;
      width: min(1760px, calc(100vw - 48px));
      min-height: calc(100vh - 48px);
      margin: 24px auto;
      grid-template-columns: 104px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--border) 8%, transparent);
      border-radius: 34px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      box-shadow:
        0 34px 120px -80px color-mix(in srgb, var(--foreground) 72%, transparent),
        inset 0 1px 0 color-mix(in srgb, var(--foreground) 80%, transparent);
      backdrop-filter: blur(28px);
    }

    .admin-sidebar {
      z-index: 2;
      width: 104px;
      padding: 26px 18px;
      background: color-mix(in srgb, var(--surface) 62%, transparent);
      border-right: 1px solid color-mix(in srgb, var(--border) 8%, transparent);
      align-items: center;
      gap: 24px;
    }

    .admin-brand {
      width: 58px;
      height: 58px;
      justify-content: center;
      gap: 0;
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 18px 44px -32px color-mix(in srgb, var(--foreground) 72%, transparent);
    }

    .admin-brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: var(--surface);
      color: var(--foreground);
      font-size: 22px;
      letter-spacing: -0.08em;
    }

    .admin-brand-text {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .admin-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .admin-nav button,
    .admin-return {
      position: relative;
      width: 56px;
      min-height: 56px;
      padding: 0;
      justify-content: center;
      border-radius: 18px;
      color: color-mix(in srgb, var(--foreground) 38%, transparent);
      background: transparent;
      border-color: transparent;
    }

    .admin-nav button:hover,
    .admin-nav button.active,
    .admin-return:hover {
      color: var(--foreground);
      background: var(--surface);
      border-color: var(--border);
      box-shadow: 0 18px 42px -30px color-mix(in srgb, var(--foreground) 62%, transparent);
    }

    .admin-nav-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font: 900 13px/1 "JetBrains Mono", monospace;
    }

    .admin-nav-label {
      position: absolute;
      left: 68px;
      top: 50%;
      z-index: 12;
      translate: 8px -50%;
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--foreground);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      font-size: 12px;
      letter-spacing: 0;
      transition: opacity 160ms ease, translate 160ms ease;
    }

    .admin-nav button:hover .admin-nav-label,
    .admin-return:hover .admin-nav-label {
      opacity: 1;
      translate: 0 -50%;
    }

    .admin-nav-index {
      display: none;
    }

    .admin-return {
      margin-top: auto;
      text-decoration: none;
      font-weight: 800;
    }

    .admin-main {
      padding: 0;
      background: color-mix(in srgb, var(--surface) 78%, transparent);
    }

    .admin-appbar {
      min-height: 92px;
      padding: 18px clamp(22px, 4vw, 48px);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 8%, transparent);
      display: grid;
      grid-template-columns: minmax(220px, auto) minmax(280px, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      background: color-mix(in srgb, var(--surface) 48%, transparent);
    }

    .admin-breadcrumb {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: color-mix(in srgb, var(--foreground) 42%, transparent);
      font-weight: 740;
      font-size: 18px;
      letter-spacing: -0.03em;
      min-width: 0;
    }

    .admin-breadcrumb strong {
      color: var(--foreground);
      font-weight: 780;
    }

    .admin-app-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: color-mix(in srgb, var(--surface-soft) 14%, transparent);
      color: var(--foreground);
      font: 900 14px/1 "JetBrains Mono", monospace;
    }

    .admin-search-shell {
      position: relative;
      min-width: 0;
    }

    .admin-search-shell::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 50%;
      width: 15px;
      height: 15px;
      translate: 0 -50%;
      border: 2px solid color-mix(in srgb, var(--border) 24%, transparent);
      border-radius: 999px;
      box-sizing: border-box;
    }

    .admin-search-shell::after {
      content: "";
      position: absolute;
      left: 31px;
      top: calc(50% + 8px);
      width: 8px;
      height: 2px;
      rotate: 45deg;
      border-radius: 99px;
      background: color-mix(in srgb, var(--surface-soft) 24%, transparent);
    }

    .admin-global-search {
      width: 100%;
      height: 54px;
      padding-left: 46px;
      border: 1px solid color-mix(in srgb, var(--border) 8%, transparent);
      background: color-mix(in srgb, var(--surface) 62%, transparent);
      color: var(--foreground);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--foreground) 85%, transparent);
      font-size: 16px;
    }
